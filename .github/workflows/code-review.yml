name: Code Review
on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]

jobs:
  review:
    # Review Trigger 조건
    # 1. PR을 새로 열었을 때
    # 2. 이미 열려있는 PR에 커밋을 추가로 push해서 브랜치가 갱신됐을 때
    # 3. PR 댓글에서 @claude를 멘션했을 때
    if: |
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request != null && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            PR: ${{ github.repository }}/pull/${{ github.event.pull_request.number }}

            이 PR의 코드를 리뷰해주세요. 버그, 성능, 가독성, 보안 관점에서 검토하고
            PR 코멘트로 남겨주세요.
          claude_args: |
            --allowedTools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"
